<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document Form</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: var(--tg-theme-bg-color, #ffffff);
      --text-color: var(--tg-theme-text-color, #222222);
      --hint-color: var(--tg-theme-hint-color, #888888);
      --button-color: var(--tg-theme-button-color, #2481cc);
      --button-text-color: var(--tg-theme-button-text-color, #ffffff);
      --secondary-bg: var(--tg-theme-secondary-bg-color, #f4f4f5);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 16px;
      box-sizing: border-box;
    }

    h2 {
      margin-top: 0;
      font-size: 20px;
      margin-bottom: 16px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-weight: 600;
      font-size: 14px;
      margin-bottom: 4px;
    }

    .description {
      font-size: 12px;
      color: var(--hint-color);
      margin-bottom: 6px;
    }

    input[type="text"],
    input[type="date"],
    input[type="number"],
    input[type="email"],
    input[type="url"],
    select,
    textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--hint-color);
      border-radius: 8px;
      background-color: var(--secondary-bg);
      color: var(--text-color);
      font-size: 14px;
      box-sizing: border-box;
      outline: none;
    }

    textarea {
      resize: vertical;
      min-height: 80px;
    }

    .checkbox-container {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }

    .checkbox-container input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--button-color);
    }

    .submit-btn {
      width: 100%;
      padding: 14px;
      background-color: var(--button-color);
      color: var(--button-text-color);
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 20px;
    }

    .submit-btn:active {
      opacity: 0.85;
    }
  </style>
</head>
<body>

  <h2>Fill Document Details</h2>
  <form id="dynamic-form">
    <div id="fields-container"></div>
    <button type="submit" class="submit-btn">Generate Document</button>
  </form>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) tg.expand();

    function getFieldsFromURL() {
      const urlParams = new URLSearchParams(window.location.search);
      const fieldsParam = urlParams.get('fields');

      if (!fieldsParam) return [];
      try {
        return JSON.parse(decodeURIComponent(fieldsParam));
      } catch (e) {
        console.error("Failed to parse fields parameter:", e);
        return [];
      }
    }

    function renderForm() {
      const fields = getFieldsFromURL();
      const container = document.getElementById('fields-container');
      container.innerHTML = '';

      if (!fields || fields.length === 0) {
        container.innerHTML = '<p style="color: var(--hint-color);">No fields found in request.</p>';
        return;
      }

      fields.sort((a, b) => (a.order || 0) - (b.order || 0));

      fields.forEach(field => {
        const group = document.createElement('div');
        group.className = 'form-group';

        const descHTML = field.description 
          ? `<div class="description">${field.description}</div>` 
          : '';

        if (field.type === 'select') {
          const opts = (field.options || []).map(opt => `<option value="${opt}">${opt}</option>`).join('');
          group.innerHTML = `
            <label for="${field.id}">${field.label}</label>
            ${descHTML}
            <select id="${field.id}" name="${field.id}">
              <option value="" disabled selected>-- Select ${field.label} --</option>
              ${opts}
            </select>`;

        } else if (field.type === 'textarea') {
          group.innerHTML = `
            <label for="${field.id}">${field.label}</label>
            ${descHTML}
            <textarea id="${field.id}" name="${field.id}" placeholder="Enter ${field.label}..."></textarea>`;

        } else if (field.type === 'checkbox') {
          group.innerHTML = `
            ${descHTML}
            <label class="checkbox-container">
              <input type="checkbox" id="${field.id}" name="${field.id}">
              <span>${field.label}</span>
            </label>`;

        } else {
          group.innerHTML = `
            <label for="${field.id}">${field.label}</label>
            ${descHTML}
            <input type="${field.type}" id="${field.id}" name="${field.id}" placeholder="Enter ${field.label}">`;
        }

        container.appendChild(group);
      });
    }

    document.getElementById('dynamic-form').addEventListener('submit', function(e) {
      e.preventDefault();
      const formData = {};

      const inputs = document.querySelectorAll('#fields-container input, #fields-container select, #fields-container textarea');
      inputs.forEach(input => {
        if (input.type === 'checkbox') {
          formData[input.id] = input.checked ? "Yes" : "No";
        } else {
          formData[input.id] = input.value || "";
        }
      });

      if (tg && tg.sendData) {
        tg.sendData(JSON.stringify(formData));
      } else {
        console.log("Form Data Payload:", JSON.stringify(formData, null, 2));
      }
    });

    renderForm();
  </script>
</body>
</html>
