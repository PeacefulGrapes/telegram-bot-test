<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CV Generator Form</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #f4f6f9);
            --card-bg: var(--tg-theme-secondary-bg-color, #ffffff);
            --text-color: var(--tg-theme-text-color, #222222);
            --hint-color: var(--tg-theme-hint-color, #8e8e93);
            --border-color: rgba(0, 0, 0, 0.08);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            border: 1px solid var(--border-color);
        }

        .form-group {
            margin-bottom: 14px;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 6px;
            text-transform: uppercase;
            color: var(--hint-color);
        }

        input[type="text"], textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-size: 15px;
            box-sizing: border-box;
            outline: none;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        .row { display: flex; gap: 10px; }
        .row .form-group { flex: 1; }
    </style>
</head>
<body>
    <form id="cvForm">
        <div class="card">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="fullName" placeholder="e.g. John Doe" required>
            </div>
            <div class="row">
                <div class="form-group">
                    <label>Date</label>
                    <input type="text" id="docDate" placeholder="e.g. Sept 2026" required>
                </div>
                <div class="form-group">
                    <label>Job Title</label>
                    <input type="text" id="jobTitle" placeholder="e.g. Developer" required>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="form-group">
                <label>CV Body / Content</label>
                <textarea id="cvContent" placeholder="Describe your experience..." required></textarea>
            </div>
        </div>
    </form>

    <script>
        const tg = window.Telegram ? window.Telegram.WebApp : null;

        if (tg) {
            tg.expand();
            tg.ready();

            // Setup native Telegram MainButton at the bottom of phone screen
            tg.MainButton.setText("GENERATE DOCUMENT");
            tg.MainButton.show();
            tg.MainButton.enable();

            tg.MainButton.onClick(function() {
                const form = document.getElementById('cvForm');

                // Validate form inputs
                if (!form.checkValidity()) {
                    form.reportValidity();
                    return;
                }

                // Haptic feedback tap
                if (tg.HapticFeedback) {
                    tg.HapticFeedback.impactOccurred('medium');
                }

                tg.MainButton.showProgress(); // Shows loading spinner on button

                const payload = {
                    name: document.getElementById('fullName').value.trim(),
                    date: document.getElementById('docDate').value.trim(),
                    title: document.getElementById('jobTitle').value.trim(),
                    content: document.getElementById('cvContent').value.trim(),
                    submitted_at: new Date().toISOString()
                };

                try {
                    tg.sendData(JSON.stringify(payload));
                    tg.close();
                } catch (err) {
                    alert("Error sending data: " + err.message);
                    tg.MainButton.hideProgress();
                }
            });
        }
    </script>
</body>
</html>
