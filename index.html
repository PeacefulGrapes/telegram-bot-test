<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dynamic Form</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      padding: 16px;
      background-color: var(--tg-theme-bg-color, #ffffff);
      color: var(--tg-theme-text-color, #000000);
      margin: 0;
    }
    h2 { margin-bottom: 16px; text-align: center; }
    .form-group { margin-bottom: 14px; }
    label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px; text-transform: capitalize; }
    input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      box-sizing: border-box;
      background-color: var(--tg-theme-secondary-bg-color, #f4f4f5);
      color: var(--tg-theme-text-color, #000000);
    }
  </style>
</head>
<body>

  <h2 id="formTitle">Fill Document</h2>
  <form id="dynamicForm">
    <div id="inputsContainer"></div>
  </form>

  <script>
    const tg = window.Telegram ? window.Telegram.WebApp : null;

    if (tg) {
      tg.expand();
      tg.ready();

      // Read fields passed via URL parameters from Python
      const urlParams = new URLSearchParams(window.location.search);
      const fieldsParam = urlParams.get('fields');

      let fields = [];
      if (fieldsParam) {
        try {
          fields = JSON.parse(decodeURIComponent(fieldsParam));
        } catch (e) {
          console.error("Failed to parse fields JSON", e);
        }
      }

      const container = document.getElementById('inputsContainer');
      document.getElementById('formTitle').innerText = `Fill Document (${fields.length} Fields)`;

      // Render input fields sequentially
      fields.forEach((field) => {
        const group = document.createElement('div');
        group.className = 'form-group';
        group.innerHTML = `
          <label for="${field.id}">${field.label}</label>
          <input type="text" id="${field.id}" name="${field.id}" placeholder="Enter ${field.label}">
        `;
        container.appendChild(group);
      });

      tg.MainButton.setText("GENERATE DOCUMENT").show();

      // Send populated values back to Telegram
      tg.MainButton.onClick(() => {
        const formData = {};
        fields.forEach((field) => {
          formData[field.id] = document.getElementById(field.id).value || '';
        });
        tg.sendData(JSON.stringify(formData));
      });
    }
  </script>
</body>
</html>
