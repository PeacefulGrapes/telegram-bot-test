<script>
  const tg = window.Telegram.WebApp;
  tg.expand();

  // 1. Read and decode the fields JSON from URL
  const urlParams = new URLSearchParams(window.location.search);
  const fieldsParam = urlParams.get('fields');

  let fields = [];
  if (fieldsParam) {
    fields = JSON.parse(decodeURIComponent(fieldsParam));
  } else {
    // Fallback default for testing in a regular web browser
    fields = [
      { id: "v1__Date", order: 1, label: "Date" },
      { id: "v2__Full_Name", order: 2, label: "Full Name" }
    ];
  }

  const container = document.getElementById('inputsContainer');
  document.getElementById('formTitle').innerText = `Fill Document (${fields.length} Fields)`;

  // 2. Render fields in the sorted order calculated by Python
  fields.forEach((field) => {
    const group = document.createElement('div');
    group.className = 'form-group';
    group.innerHTML = `
      <label for="${field.id}">${field.label}</label>
      <input type="text" id="${field.id}" name="${field.id}" placeholder="Enter ${field.label}">
    `;
    container.appendChild(group);
  });

  tg.MainButton.setText("Generate Document").show();

  // 3. Collect responses mapped back to the exact Jinja tags in Word
  tg.MainButton.onClick(() => {
    const formData = {};
    fields.forEach((field) => {
      formData[field.id] = document.getElementById(field.id).value || '';
    });
    tg.sendData(JSON.stringify(formData));
  });
</script>
