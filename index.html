<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dynamic Document Generator</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      padding: 16px;
      background-color: var(--tg-theme-bg-color, #ffffff);
      color: var(--tg-theme-text-color, #000000);
      margin: 0;
    }
    h2 { margin-bottom: 16px; text-align: center; }
    .form-group { margin-bottom: 12px; }
    label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px; text-transform: capitalize; }
    input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      box-sizing: border-box;
      background-color: var(--tg-theme-secondary-bg-color, #f4f4f5);
      color: var(--tg-theme-text-color, #000000);
    }
  </style>
</head>
<body>

  <h2 id="formTitle">Fill Document Fields</h2>
  <form id="dynamicForm">
    <div id="inputsContainer"></div>
  </form>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    // 1. Parse URL variables passed from Python
    const urlParams = new URLSearchParams(window.location.search);
    const varsParam = urlParams.get('vars');

    const container = document.getElementById('inputsContainer');
    let fieldList = [];

    if (varsParam) {
      fieldList = varsParam.split(',');
    } else {
      fieldList = ['var1', 'var2', 'var3']; // Fallback if tested directly in browser
    }

    document.getElementById('formTitle').innerText = `Fill Document (${fieldList.length} Fields)`;

    // 2. Generate input elements dynamically for each variable
    fieldList.forEach((varName) => {
      const group = document.createElement('div');
      group.className = 'form-group';
      
      // Formats "full_name" into "full name" for clean UI display
      const displayLabel = varName.replace(/_/g, ' ');

      group.innerHTML = `
        <label for="${varName}">${displayLabel}</label>
        <input type="text" id="${varName}" name="${varName}" placeholder="Enter ${displayLabel}">
      `;
      container.appendChild(group);
    });

    // 3. Show main submit button inside Telegram
    tg.MainButton.setText("Generate Document").show();

    // 4. Send filled data back to python
    tg.MainButton.onClick(() => {
      const formData = {};
      fieldList.forEach((varName) => {
        formData[varName] = document.getElementById(varName).value || '';
      });
      tg.sendData(JSON.stringify(formData));
    });
  </script>
</body>
</html>
