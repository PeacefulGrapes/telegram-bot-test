<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dynamic Form</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      padding: 16px;
      background-color: var(--tg-theme-bg-color, #ffffff);
      color: var(--tg-theme-text-color, #000000);
      margin: 0;
    }
    h2 { margin-bottom: 16px; text-align: center; }
    .form-group { margin-bottom: 14px; }
    label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 2px; text-transform: capitalize; }
    
    input, textarea, select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      box-sizing: border-box;
      background-color: var(--tg-theme-secondary-bg-color, #f4f4f5);
      color: var(--tg-theme-text-color, #000000);
      font-family: inherit;
      font-size: 14px;
    }

    textarea {
      resize: vertical;
      min-height: 90px;
    }
  </style>
</head>
<body>

  <h2 id="formTitle">Fill Document</h2>
  <form id="dynamicForm">
    <div id="inputsContainer"></div>
  </form>

  <script>
    const tg = window.Telegram ? window.Telegram.WebApp : null;

    if (tg) {
      tg.expand();
      tg.ready();

      const urlParams = new URLSearchParams(window.location.search);
      const fieldsParam = urlParams.get('fields');

      let fields = [];
      if (fieldsParam) {
        try {
          fields = JSON.parse(decodeURIComponent(fieldsParam));
        } catch (e) {
          console.error("Failed to parse fields JSON", e);
        }
      }

      const container = document.getElementById('inputsContainer');
      document.getElementById('formTitle').innerText = `Fill Document (${fields.length} Fields)`;

      // =========================================================================
      // PASTE SNIPPET HERE: Replaces the previous fields.forEach loop
      // =========================================================================
fields.forEach((field) => {
  const group = document.createElement('div');
  group.className = 'form-group';

  const descHTML = field.description 
    ? `<small style="color: var(--tg-theme-hint-color, #777); display: block; font-size: 11px; margin-bottom: 4px;">${field.description}</small>` 
    : '';

  if (field.type === 'select') {
    const optionsHTML = field.options.map(opt => `<option value="${opt}">${opt}</option>`).join('');
    group.innerHTML = `
      <label for="${field.id}">${field.label}</label>
      ${descHTML}
      <select id="${field.id}" name="${field.id}">
        <option value="" disabled selected>-- Select ${field.label} --</option>
        ${optionsHTML}
      </select>`;

  } else if (field.type === 'textarea') {
    group.innerHTML = `
      <label for="${field.id}">${field.label}</label>
      ${descHTML}
      <textarea id="${field.id}" name="${field.id}" rows="4" placeholder="Enter ${field.label}..."></textarea>`;

  } else if (field.type === 'checkbox') {
    // Checkbox input layout
    group.innerHTML = `
      ${descHTML}
      <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
        <input type="checkbox" id="${field.id}" name="${field.id}" style="width: auto;">
        ${field.label}
      </label>`;

  } else {
    // Handles text, date, number, email, tel, url automatically via type attribute
    group.innerHTML = `
      <label for="${field.id}">${field.label}</label>
      ${descHTML}
      <input type="${field.type}" id="${field.id}" name="${field.id}" placeholder="Enter ${field.label}">`;
  }

  container.appendChild(group);
});
      // =========================================================================

      tg.MainButton.setText("GENERATE DOCUMENT").show();

      tg.MainButton.onClick(() => {
        const formData = {};
        fields.forEach((field) => {
          formData[field.id] = document.getElementById(field.id).value || '';
        });
        tg.sendData(JSON.stringify(formData));
      });
    }
  </script>
</body>
</html>
