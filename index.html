<script>
    // Initialize Telegram WebApp SDK
    const tg = window.Telegram ? window.Telegram.WebApp : null;

    if (tg) {
        tg.expand(); // Expand web app to full screen
        tg.ready();  // Signal to Telegram that the app is loaded
    }

    const form = document.getElementById('cvForm');

    form.addEventListener('submit', function(e) {
        e.preventDefault();

        // Collect all input values into a structured JSON payload
        const payload = {
            name: document.getElementById('fullName').value.trim(),
            date: document.getElementById('docDate').value.trim(),
            title: document.getElementById('jobTitle').value.trim(),
            content: document.getElementById('cvContent').value.trim(),
            submitted_at: new Date().toISOString()
        };

        const submitBtn = document.getElementById('submitBtn');
        submitBtn.innerText = "Sending to Telegram...";
        submitBtn.disabled = true;

        if (tg && tg.sendData) {
            try {
                // Send JSON payload back to the Python bot
                tg.sendData(JSON.stringify(payload));
                tg.close(); // Close the mini app window
            } catch (err) {
                alert("Telegram WebApp Error: " + err.message);
                submitBtn.disabled = false;
                submitBtn.innerText = "Generate Document";
            }
        } else {
            alert("This form must be opened inside the Telegram app!");
            submitBtn.disabled = false;
            submitBtn.innerText = "Generate Document";
        }
    });
</script>
